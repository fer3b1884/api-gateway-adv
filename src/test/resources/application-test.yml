spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**,/api/v1/payment-cards/**

            - id: authentication-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/refresh

app:
  internal:
    secret: internal-secret