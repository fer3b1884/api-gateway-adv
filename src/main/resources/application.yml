server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}

spring:
  application:
    name: api-gateway-adv

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**,/api/v1/payment-cards/**

            - id: authentication-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/refresh

services:
  user:
    base-url: http://localhost:8081
  authentication:
    base-url: http://localhost:8082

app:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET}