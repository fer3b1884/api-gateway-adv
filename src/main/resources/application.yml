server:
  port: 8080

spring:
  application:
    name: api-gateway-adv

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**,/api/payment-cards/**

            - id: authentication-service
              uri: http://localhost:8082
              predicates:
                - Path=/auth/**
